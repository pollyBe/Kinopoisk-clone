<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Каталог фильмов и сериалов: подборки, поиск, фильтры, актёры."
    />
    <title>Kinopoisk-clone</title>
    <script>
      // Тему ставим до отрисовки, чтобы не было вспышки светлой темы
      ;(function () {
        var theme = "light"
        try {
          var saved = localStorage.getItem("theme")
          if (saved === "light" || saved === "dark") theme = saved
          else if (matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark"
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
